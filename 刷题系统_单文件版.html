<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python二级刷题系统</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
body { background:#eef1f6; color:#1f2937; padding:24px; }
.wrap { max-width:860px; margin:0 auto; }

/* 顶部 */
.header { text-align:center; margin-bottom:24px; }
.header h1 { font-size:24px; color:#111827; margin-bottom:6px; }
.header p { color:#6b7280; font-size:14px; }

/* 卡片 */
.card { background:#fff; border-radius:16px; box-shadow:0 6px 24px rgba(17,24,39,.06); padding:32px; }

/* 模式选择 */
.mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.mode-card { border:2px solid transparent; border-radius:18px; padding:36px 24px; cursor:pointer; transition:.2s; text-align:center; position:relative; overflow:hidden; }
.mode-card .emoji { font-size:64px; line-height:1; }
.mode-card h3 { margin:16px 0 10px; font-size:23px; color:#111827; font-weight:700; }
.mode-card p { color:#4b5563; font-size:14px; line-height:1.7; }
.mode-card .go { display:inline-block; margin-top:18px; padding:8px 22px; border-radius:99px; color:#fff; font-size:15px; font-weight:600; }
/* 刷题模式：蓝色系 */
.mode-card.exam { background:linear-gradient(160deg,#eaf3ff,#f5faff); }
.mode-card.exam:hover { transform:translateY(-4px); box-shadow:0 12px 28px rgba(64,158,255,.25); border-color:#409eff; }
.mode-card.exam .go { background:#409eff; }
/* 学习模式：绿色系 */
.mode-card.study { background:linear-gradient(160deg,#eafaf0,#f5fdf8); }
.mode-card.study:hover { transform:translateY(-4px); box-shadow:0 12px 28px rgba(103,194,58,.25); border-color:#67c23a; }
.mode-card.study .go { background:#67c23a; }

/* 通用按钮 */
.btn { display:inline-flex; align-items:center; justify-content:center; height:44px; padding:0 22px; background:#409eff; color:#fff; border:none; border-radius:10px; font-size:15px; cursor:pointer; transition:.18s; }
.btn:hover { background:#337ecc; transform:translateY(-1px); }
.btn:active { transform:scale(.98); }
.btn.ghost { background:#f3f4f6; color:#374151; }
.btn.ghost:hover { background:#e5e7eb; }
.btn.warn { background:#ff7a7a; }
.btn.warn:hover { background:#ff6060; }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }

.toolbar { display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
.toolbar .spacer { flex:1; }
.back-link { color:#409eff; cursor:pointer; font-size:14px; }
.back-link:hover { text-decoration:underline; }

/* 进度条 */
.progress { height:8px; background:#eef1f6; border-radius:99px; overflow:hidden; margin-bottom:22px; }
.progress i { display:block; height:100%; background:linear-gradient(90deg,#409eff,#66b1ff); transition:width .3s; }

/* 题目 */
.q-meta { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
.tag { font-size:12px; padding:3px 10px; border-radius:99px; background:#e8f3ff; color:#409eff; }
.tag.type { background:#f0f9eb; color:#67c23a; }
.q-title { font-size:21px; line-height:1.8; color:#1f2937; margin-bottom:24px; font-weight:500; }
.q-title pre { background:#f6f8fa; padding:12px 14px; border-radius:8px; margin:12px 0; font-family:"SFMono-Regular",Consolas,monospace; font-size:14px; overflow-x:auto; line-height:1.5; }

.options { display:flex; flex-direction:column; gap:12px; }
.opt { display:flex; align-items:flex-start; gap:12px; padding:14px 18px; border:1.5px solid #e5e7eb; border-radius:10px; cursor:pointer; transition:.15s; background:#fff; }
.opt:hover { border-color:#409eff; background:#f5faff; }
.opt .key { flex-shrink:0; width:26px; height:26px; border-radius:50%; background:#f0f2f5; color:#6b7280; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; }
.opt .txt { flex:1; font-size:17px; color:#374151; padding-top:2px; }
.opt.selected { border-color:#409eff; background:#ecf5ff; }
.opt.selected .key { background:#409eff; color:#fff; }
.opt.correct { border-color:#67c23a; background:#f0f9eb; }
.opt.correct .key { background:#67c23a; color:#fff; }
.opt.wrong { border-color:#f56c6c; background:#fef0f0; }
.opt.wrong .key { background:#f56c6c; color:#fff; }

/* 判断题大按钮 */
.tf-options { display:flex; gap:16px; }
.tf-btn { flex:1; padding:26px 0; border:2.5px solid #e5e7eb; border-radius:16px; background:#fff; cursor:pointer; text-align:center; transition:.15s; }
.tf-btn .tf-icon { font-size:44px; line-height:1; }
.tf-btn .tf-label { font-size:20px; font-weight:700; margin-top:8px; color:#374151; }
.tf-btn.yes:hover { border-color:#67c23a; background:#f0f9eb; }
.tf-btn.no:hover  { border-color:#f56c6c; background:#fef0f0; }
.tf-btn.selected.yes { border-color:#67c23a; background:#f0f9eb; }
.tf-btn.selected.no  { border-color:#f56c6c; background:#fef0f0; }
.tf-btn.correct { border-color:#67c23a; background:#f0f9eb; box-shadow:0 0 0 3px rgba(103,194,58,.15); }
.tf-btn.wrong   { border-color:#f56c6c; background:#fef0f0; }

/* 解析 */
.analysis { margin-top:20px; padding:16px 18px; border-radius:10px; background:#fff7f7; border:1px solid #ffd9d9; line-height:1.7; }
.analysis b { color:#d03020; }
.analysis .ans { font-size:16px; margin-bottom:8px; }
.analysis .ans em { color:#67c23a; font-style:normal; font-weight:700; }

/* 结果页 */
.result-page { text-align:center; }
.result-stars { font-size:44px; margin-bottom:6px; letter-spacing:6px; }
.result-praise { color:#f59e0b; font-size:17px; font-weight:600; margin-top:12px; }
.score-ring { width:150px; height:150px; margin:10px auto 20px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:conic-gradient(#409eff var(--p),#eef1f6 0); }
.score-ring .inner { width:120px; height:120px; border-radius:50%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.score-ring .num { font-size:40px; font-weight:700; color:#409eff; }
.score-ring .lbl { font-size:13px; color:#6b7280; }
.wrong-list { text-align:left; margin-top:24px; }
.wrong-list h3 { color:#d03020; margin-bottom:16px; }
.wrong-item { padding:16px; border-radius:10px; background:#fafbfc; border:1px solid #eef1f6; margin-bottom:14px; }
.wrong-item .wt { font-weight:500; margin-bottom:10px; line-height:1.6; }
.wrong-item .line { font-size:14px; margin:4px 0; }
.wrong-item .mine { color:#f56c6c; }
.wrong-item .right { color:#67c23a; }
.wrong-item .exp { color:#6b7280; font-size:13px; line-height:1.6; margin-top:8px; }

/* 学习模式筛选 */
.filters { display:grid; grid-template-columns:1fr; gap:20px; margin-bottom:22px; }
.filter-block label { display:block; font-size:14px; color:#6b7280; margin-bottom:10px; }
.chips { display:flex; gap:10px; flex-wrap:wrap; }
.chip { padding:9px 18px; border-radius:99px; border:1.5px solid #e5e7eb; background:#fff; cursor:pointer; font-size:15px; color:#374151; transition:.15s; }
.chip:hover { border-color:#409eff; }
.chip.active { background:#409eff; border-color:#409eff; color:#fff; }
.study-count { text-align:center; color:#6b7280; font-size:13px; margin-bottom:16px; }

/* 弹窗 */
.modal-mask { position:fixed; inset:0; background:rgba(17,24,39,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:50; }
.modal-mask.show { display:flex; }
.modal { background:#fff; border-radius:16px; max-width:560px; width:100%; max-height:80vh; overflow-y:auto; padding:28px; animation:pop .2s ease; }
@keyframes pop { from{transform:scale(.92);opacity:0} to{transform:scale(1);opacity:1} }
.modal h3 { color:#111827; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.modal-result { text-align:center; font-size:18px; font-weight:600; margin-bottom:12px; color:#6b7280; }
.modal-result.ok { color:#67c23a; }
.modal-result.no { color:#f59e0b; }
.modal .big-ans { font-size:26px; font-weight:800; color:#67c23a; text-align:center; margin:8px 0 20px; line-height:1.5; }
.modal .modal-exp { background:#f6f8fa; border-radius:10px; padding:16px; line-height:1.7; color:#374151; font-size:14px; }
.modal .close { margin-top:20px; text-align:right; }

.hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Python二级刷题系统</h1>
    <p id="subtitle">题库共 <b id="totalCount">0</b> 题 · 选择一个模式开始</p>
  </div>

  <!-- 模式选择 -->
  <div class="card" id="homeView">
    <div class="mode-grid">
      <div class="mode-card exam" onclick="enterExam()">
        <div class="emoji">✏️</div>
        <h3>刷题模式</h3>
        <p>随机抽 10 道题组成一套小卷子，<br>做完提交看得分，还有星星奖励！</p>
        <span class="go">开始刷题 →</span>
      </div>
      <div class="mode-card study" onclick="enterStudy()">
        <div class="emoji">📚</div>
        <h3>学习模式</h3>
        <p>挑一个知识点，随机出一道题练习，<br>点【显示答案】马上知道对不对～</p>
        <span class="go">开始学习 →</span>
      </div>
    </div>
  </div>

  <!-- 刷题模式 -->
  <div class="card hidden" id="examView">
    <div class="toolbar">
      <span class="back-link" onclick="goHome()">← 返回</span>
      <div class="spacer"></div>
      <span id="examProgress" style="color:#6b7280;font-size:14px;"></span>
    </div>
    <div class="progress"><i id="examBar" style="width:0"></i></div>
    <div id="examBody"></div>
    <div class="toolbar" style="margin-top:24px;">
      <button class="btn ghost" id="prevBtn" onclick="examPrev()">上一题</button>
      <div class="spacer"></div>
      <button class="btn" id="nextBtn" onclick="examNext()">下一题</button>
      <button class="btn warn hidden" id="submitBtn" onclick="examSubmit()">提交试卷</button>
    </div>
  </div>

  <!-- 刷题结果 -->
  <div class="card hidden" id="resultView">
    <div class="result-page">
      <div class="result-stars" id="resultStars"></div>
      <div class="score-ring" id="scoreRing"><div class="inner"><div class="num" id="scoreNum">0</div><div class="lbl">答对题数</div></div></div>
      <p style="color:#6b7280;">本次共 10 题，答对 <b id="scoreText">0</b> 题</p>
      <p class="result-praise" id="resultPraise"></p>
      <div class="toolbar" style="justify-content:center;margin-top:20px;">
        <button class="btn" onclick="enterExam()">再来一套</button>
        <button class="btn ghost" onclick="goHome()">返回首页</button>
      </div>
      <div class="wrong-list" id="wrongList"></div>
    </div>
  </div>

  <!-- 学习模式 -->
  <div class="card hidden" id="studyView">
    <div class="toolbar">
      <span class="back-link" onclick="goHome()">← 返回</span>
      <div class="spacer"></div>
    </div>
    <div class="filters">
      <div class="filter-block">
        <label>选一个你想练的知识点</label>
        <div class="chips" id="topicChips"></div>
      </div>
      <div class="filter-block">
        <label>选题目类型</label>
        <div class="chips" id="typeChips"></div>
      </div>
    </div>
    <div class="study-count" id="studyCount"></div>
    <div class="toolbar" style="justify-content:center;">
      <button class="btn" onclick="drawStudyQuestion()">🎲 随机出题</button>
    </div>
    <div id="studyBody" style="margin-top:10px;"></div>
  </div>
</div>

<!-- 显示答案弹窗 -->
<div class="modal-mask" id="ansModal" onclick="if(event.target===this)closeAnsModal()">
  <div class="modal">
    <h3>💡 答案和讲解</h3>
    <div class="modal-result" id="modalResult"></div>
    <div class="big-ans" id="modalAns"></div>
    <div class="modal-exp" id="modalExp"></div>
    <div class="close"><button class="btn" onclick="closeAnsModal()">我知道啦</button></div>
  </div>
</div>

<script>
// Python二级题库（练习卷1+2+3，共78题）
const questionBank = [
  {id:1,title:"选项中，不属于列表类型的是？",options:{A:"[100, 200, 300]",B:"['孙悟空', '猪八戒', '沙和尚']",C:"['VIP', '李白']",D:"{'num' : '001'}"},answer:"D",analysis:"列表的特征是最外层有一对中括号[]，元素之间用英文逗号隔开。因此ABC选项都为列表类型，D选项最外层为英文大括号，并且元素为键值对，属于字典类型，所以选择D选项。"},
  {id:2,title:"下方程序的输出结果是？<pre>number = ['three']\nnumber.append('one')\nnumber.append('two')\nnumber.remove('three')\nprint(number)</pre>",options:{A:"['one', 'two']",B:"['one']",C:"[]",D:"['one', 'two','three']"},answer:"A",analysis:"append()方法可以向列表末尾添加元素。remove()方法可以删除列表中指定元素。执行第2、3行代码后，会依次向列表number的末尾添加'one'、'two'，此时列表number为['three', 'one', 'two']。接着执行第4行代码，会删除列表number中的'three'元素，此时列表number为['one', 'two']。最后打印的结果为['one', 'two']，选择A选项。"},
  {id:3,title:"执行下方程序，输入450，输出结果是？<pre>weight = int(input())\nif weight < 300:\n  print('小份')\nelif weight < 500:\n  print('中份')\nelse:\n  print('大份')</pre>",options:{A:"小份",B:"中份",C:"大份",D:"450"},answer:"B",analysis:"这是一个多分支语句，程序自上而下按顺序执行，如果遇到满足的条件，则执行该条件下方带缩进的语句，不再向下判断。题目中输入450，因此变量weight的值为450，判断weight<300的结果为False，不满足if后面的条件，继续向下判断；weight<500的结果为True，满足第一个elif后面的条件，所以执行print('中份')，输出结果是“中份”，选择B选项。"},
  {id:4,title:"下方程序的输出结果一定不会有？<pre>import random\nL = ['胶水','平板','电脑','桌椅']\nprint(random.choice(L))</pre>",options:{A:"铅笔",B:"平板",C:"电脑",D:"胶水"},answer:"A",analysis:"random是Python中的随机模块，其中choice(L)可以随机输出列表L中的一个元素，有可能是胶水、平板、电脑、桌椅，一定不会输出铅笔。所以选择A选项。"},
  {id:5,title:"已知列表 Country = ['中国','美国','日本','西班牙','德国']，其中“中国”的索引是？",options:{A:"0",B:"1",C:"2",D:"3"},answer:"A",analysis:"列表的正序索引从0开始，从左往右数依次为0、1、2........所以“中国”的索引是0，选择A选项。"},
  {id:6,title:"执行下方流程图，如果输入77，会输出什么？<br>开始→输入a→判断a>=60，是则输出通过，否则输出未通过→结束",options:{A:"77",B:"通过",C:"未通过",D:"开始"},answer:"B",analysis:"根据流程图，如果输入的a大于等于60，则走“是”路线，会输出“通过”；如果输入的a小于60，则走“否”路线，会输出“未通过”。本题输入的77大于60，走“是”路线，输出“通过”，选择B选项。"},
  {id:7,title:"已知下列图形代表不同的数，根据等式计算出□代表多少？<br>等式1：△+△+△=15<br>等式2：△+□=15",options:{A:"3",B:"5",C:"10",D:"20"},answer:"C",analysis:"首先看等式 1：△+△+△=15，即 3个△=15，由此可算出 △=15÷3=5。再看等式 2：△+□=15，把 △=5代入，可得 □=15-5=10。因此，□代表的数是 10，选择C选项。"},
  {id:8,title:"哪个变量info中存储的是字典类型？",options:{A:"info = {'age': 25, 'city': 'Beijing'}",B:"info = ['age', 25, 'city', 'Beijing']",C:"info = 'age: 25, city: Beijing'",D:"info = ('age', 25, 'city', 'Beijing')"},answer:"A",analysis:"字典类型的特征是最外层有一对大括号{ }，组成字典的元素是键值对 {键:值} 。A选项info = {'age': 25, 'city': 'Beijing'} 符合字典类型的语法格式，所以选择A选项。"},
  {id:9,title:"执行下方程序，输出的结果是？<pre>m = ['a','b','c']\nn = m + ['d','e']\nprint(n)</pre>",options:{A:"['a', 'b', 'c']",B:"['d', 'e']",C:"['a', 'b', 'c', 'd', 'e']",D:"['a', 'b', 'c', 'd']"},answer:"C",analysis:"使用加号可以拼接列表，m的值是['a','b','c']，执行m+['d','e']就是执行：['a','b','c']+['d','e']，拼接结果为['a', 'b', 'c', 'd', 'e']。选择C选项。"},
  {id:10,title:"在一个游戏中，主角每次遇到“宝剑”道具就能获得技能。请问按照下方程序的逻辑，主角最终会获得多少个技能？<pre>items = ['宝剑', '魔法书', '盾牌', '宝剑', '弓箭', '宝剑']\ncnt = 0\nfor i in items:\n  if i == '宝剑':\n    cnt = cnt + 1\nprint(cnt)</pre>",options:{A:"1",B:"2",C:"3",D:"4"},answer:"C",analysis:"程序会使用for循环遍历items列表中的每一个道具类型。如果遇到的是“宝剑”，则变量cnt会加1。已知items列表中总共有3个“宝剑”，所以会有3次获得技能的机会。因此cnt的值为3。选择C选项。"},
  {id:11,title:"关于下方程序，描述正确的是？<pre>import time\nfor i in range(3):\n  time.sleep(1)\n  print(i)</pre>",options:{A:"该程序一共会等待3秒钟",B:"程序一共执行了2次循环",C:"该程序一共会等待30秒钟",D:"程序的输出结果为“3”"},answer:"A",analysis:"time.sleep(1)参数单位为“秒”。该程序使用for循环遍历range(3)生成的序列，并依次输出序列中的每个值，因此输出结果为0，1，2。一共会循环3次，每次循环都会等待1秒，共等待3秒。由上述内容，选择A选项。"},
  {id:12,title:"下方程序的输出结果是？<pre>P = []\nP.append('red')\nP.append('green')\nP.append('blue')\nprint(P)</pre>",options:{A:"['red', 'green', 'blue']",B:"['blue', 'green','red']",C:"[]",D:"P"},answer:"A",analysis:"append()方法可以向列表末尾添加元素。执行程序后，会依次向列表P的末尾添加'red'、'green'、'blue'。所以输出结果是['red', 'green', 'blue']，选择A选项。"},
  {id:13,title:"下方程序的输出结果是？<pre>p = '我'\nq = '爱'\nr = '妈'\nprint(p+q+r*2)</pre>",options:{A:"我爱妈妈",B:"我",C:"妈妈爱我",D:"我爱妈"},answer:"A",analysis:"此题考察字符串的拼接，变量p、变量q和变量r 均是字符串类型，r*2表示将字符串内容复制两次，结果为'妈妈'。p+q+r*2表示拼接字符串'我'、'爱'和'妈妈'，结果为'我爱妈妈'，所以选择A选项。"},
  {id:14,title:"关于下方程序，选项中的说法正确的是？<pre>pwd = 'open8'\nif pwd == 'open8':\nprint('密码正确')\nelse:\nprint('密码错误')</pre>",options:{A:"该程序输出结果为“密码错误”",B:"该程序输出结果为“密码正确”",C:"该程序有语法错误，无法运行",D:"该程序使用了循环结构"},answer:"C",analysis:"该程序使用了双分支结构，正确语法格式为：if 条件: 执行语句 else: 执行语句。注意，if和else中的执行语句，需在每行最前面添加缩进格式，而题目的程序没有缩进格式，因此出现了语法错误，导致程序无法运行，正确答案选C。"},
  {id:15,title:"以下代码的输出结果是什么？<pre>for i in range(5):\n  if i == 2:\n    break\n  else:\n    print(i)</pre>",options:{A:"0 1",B:"0 1 2",C:"0 1 2 3 4",D:"没有输出"},answer:"A",analysis:"该程序中range(5)会生成0、1、2、3、4的数字序列。第一次循环i为0，条件不成立，输出0；第二次i为1，输出1；第三次i为2，条件成立，执行break结束循环，因此不会输出2，后续3、4也不会执行。故只能打印0和1，正确答案选A。"},
  {id:16,title:"执行下方程序，输出结果是？<pre>for M in range(2,5):\n  print(M)</pre>",options:{A:"2 3 4",B:"2 3 4 5",C:"1",D:"5"},answer:"A",analysis:"range(2,5)会生成2、3、4这三个数字的序列（包前不包后），所以该程序会执行3次循环，每次循环都会执行print(M)，所以程序会依次输出2、3、4这三个数字。故选择A选项。"},
  {id:17,title:"运行程序输出了“白雪皑皑”，误删了第一行的部分代码，请还原。<pre>q = --误删处--\nif q == 'snow':\n  print('白雪皑皑')\nelif q == 'rain':\n  print('雨水滴答')\nelif q == 'sun':\n  print('阳光灿烂')\nelse:\n  print('未识别')</pre>",options:{A:"'snow'",B:"'rain'",C:"'sun'",D:"'cold'"},answer:"A",analysis:"这是一个多分支语句，如果想要输出“白雪皑皑”，需要满足q == 'snow'的条件，所以第一行代码应该是q = 'snow'，选择A选项。"},
  {id:18,title:"如何删除下方列表中全部的“value”元素？<pre>num = [99,90,'value',93,99,'value','value']</pre>",options:{A:"num.remove('value')",B:"num.remove('value') num.remove('value') num.remove('value')",C:"num.append('value')",D:"num.append('value') num.append('value') num.append('value')"},answer:"B",analysis:"remove()可以删除列表中指定元素的第一个匹配项；append()可以向列表末尾添加元素。列表中有3个'value'，A只能删1个，B可以删除全部3个'value'。综上，选择B选项。"},
  {id:19,title:"执行下方程序，输出的结果是？<pre>weather = ['晴','阴','雨']\nfor i in weather:\n  print(i)</pre>",options:{A:"晴",B:"晴阴",C:"阴雨",D:"晴阴雨"},answer:"D",analysis:"这段程序通过for循环遍历列表weather，会依次取出列表中的每个元素并打印。因此程序会依次输出“晴”“阴”“雨”，最终选择D选项。"},
  {id:20,title:"某查询系统代码如下，如果输入“查询”，程序会输出什么？<pre>while True:\n  a = input()\n  if a == \"查询\":\n    print(\"当前剩余座位数：50\")\n    break\n  else:\n    print(\"无效请求，请重新输入\")</pre>",options:{A:"当前剩余座位数：50",B:"无效请求，请重新输入",C:"无任何输出",D:"查询"},answer:"A",analysis:"程序进入while True循环后，input()将输入内容“查询”赋值给a。if a == \"查询\"条件成立，输出“当前剩余座位数：50”，随后break结束循环。故正确答案选A。"},
  {id:21,title:"列表 n = ['我','的','母','亲']，其中元素'亲'的索引是0。",options:{A:"正确",B:"错误"},answer:"B",analysis:"列表的正序索引从0开始，从左往右数依次为0、1、2........元素'亲'的索引为3，题目描述错误。"},
  {id:22,title:"执行下方程序，输出结果为False。<pre>M = True\nN = False\nprint(M or N)</pre>",options:{A:"正确",B:"错误"},answer:"B",analysis:"or是逻辑运算符，表示或者，使用or连接的两个条件只要有一个为真，结果就为真。True or False结果为True，题目描述错误。"},
  {id:23,title:"运行程序后，输出结果是5。<pre>weekdays=[\"周一\",\"周二\",\"周三\",\"周四\",\"周五\"]\nprint(len(weekdays))</pre>",options:{A:"正确",B:"错误"},answer:"A",analysis:"len()方法可以获取列表weekdays的长度。列表weekdays中包含5个元素，所以长度为5。故题目描述正确。"},
  {id:24,title:"列表如下，可以使用 flower[3] = '百合'，将“仙人掌”替换成“百合”。<pre>flower =['玫瑰', '牡丹', '茉莉', '仙人掌']</pre>",options:{A:"正确",B:"错误"},answer:"A",analysis:"修改列表中的元素，可以使用 列表[索引]=值。\"仙人掌\"的索引为3，所以可以使用 flower[3] = '百合'，题目描述正确。"},
  {id:25,title:"执行下方程序，列表T的结果为['公交','地铁']。<pre>T = ['飞机','高铁','公交','地铁']\nT.remove('飞机')\nT.remove('高铁')</pre>",options:{A:"正确",B:"错误"},answer:"A",analysis:"remove()方法可以删除列表中的指定元素。执行两次remove后，列表T最终变为['公交','地铁']，与题目描述一致。因此选择A选项。"},
  {id:26,title:"执行程序，输出结果是“维生素D”。<pre>m = ['维生素A','维生素B','维生素C','维生素D']\nprint(m[0])</pre>",options:{A:"正确",B:"错误"},answer:"B",analysis:"列表的正序索引从0开始，m[0]可以获取列表m中索引为0的元素，打印m[0]的结果为“维生素A”，题目描述错误。"},
  {id:27,title:"执行下方程序会打印 4个“溜溜梅”。<pre>for i in range(4):\n  print('溜溜梅')\n  print('溜溜梅')</pre>",options:{A:"正确",B:"错误"},answer:"B",analysis:"range(4)会生成0、1、2、3的序列，程序循环四次，每次循环打印2个“溜溜梅”，总共打印2x4=8个，题目描述错误。"},
  {id:28,title:"下方程序无任何语法错误，运行结果为“9元钱”。<pre>food = '佛跳墙'\nif food=='小葱拌豆腐':\nprint('9元钱')</pre>",options:{A:"正确",B:"错误"},answer:"B",analysis:"单分支语句中if的执行语句需在每行最前面添加缩进格式。题目程序中print()语句前缺少缩进格式，出现了语法错误，故题目描述错误。"},
  {id:29,title:"已知某车辆信息如下，可以使用 car_7890['颜色'] 获取车辆颜色“红色”。<pre>car_7890 = {'编号':'7890','颜色':'红色', '型号':'宝马X5', '出厂年份':2016}</pre>",options:{A:"正确",B:"错误"},answer:"A",analysis:"在字典中可以通过键获取值，语法格式：字典名[键名]。键'颜色'对应的值是'红色'，所以使用 car_7890['颜色'] 可以获取到“红色”，描述正确。"},
  {id:30,title:"黑客利用 AI 算法绕过安全防护系统的身份验证机制，获取用户账户权限，这种行为违反网络安全法规。",options:{A:"正确",B:"错误"},answer:"A",analysis:"利用 AI 绕过身份验证机制获取权限，属于非法获取数据和侵犯用户权益行为，违反网络安全法规。故题目描述正确。"},
  {id:31,title:"下方程序的打印结果是True。<pre>print(True and False)</pre>",options:{A:"正确",B:"错误"},answer:"B",analysis:"and是逻辑运算符，表示并且，使用and连接的两个条件必须都为真结果才为真。True and False结果为False。题目描述错误。"},
  {id:32,title:"执行下方程序，只能输出1次“朋友”。<pre>while True:\n  print(\"朋友\")\n  break</pre>",options:{A:"正确",B:"错误"},answer:"A",analysis:"程序先打印一次“朋友”，然后执行break结束循环，不会继续重复打印。因此只能输出1次“朋友”，题目描述正确。"},
  {id:33,title:"运行下方程序，可以打印10次“壮猿”。<pre>for i in range(10):\n  print(\"壮猿\")</pre>",options:{A:"正确",B:"错误"},answer:"A",analysis:"range(10)会生成0~9的数字序列，程序执行10次循环，每次循环执行print(\"壮猿\")，所以会打印10次壮猿，故描述正确。"},
  {id:34,title:"在Python中，可以使用int('星球')将数据类型强制转换为整数。",options:{A:"正确",B:"错误"},answer:"B",analysis:"int()的参数必须是可以解析为整数的字符串。字符串'星球'无法被解析为整数，使用int('星球')会报错，所以题目描述错误。"},
  {id:35,title:"执行下方程序，输出的结果是“金卡会员”。<pre>num = 7\ncode = 'vip999'\nif code == 'vip999':\n  if num > 50:\n    print('金卡会员')\n  else:\n    print('银卡会员')\nelse:\n  print('普通会员')</pre>",options:{A:"正确",B:"错误"},answer:"B",analysis:"该程序使用了分支嵌套结构。code为'vip999'满足外层if；num为7不满足内层if num > 50，因此执行内层else输出'银卡会员'，而不是'金卡会员'。题目描述错误。"},
  {id:36,title:"被后人称为“人工智能之父”的科学家是？",options:{A:"瓦特",B:"图灵",C:"爱迪生",D:"乔布斯"},answer:"B",analysis:"被后人称为“人工智能之父”的科学家是图灵，选择B选项。"},
  {id:37,title:"哪个选项中存储的是列表类型数据？",options:{A:"L =（1，2）",B:"L = [100, ['冰糖雪梨']]",C:"L = {'age' : '12'}",D:"L = {'a', 'b', 'c'}"},answer:"B",analysis:"列表的特征是最外层有一对中括号[]。A选项是元组，B选项是列表，C选项是字典，D选项为集合。故选择B选项。"},
  {id:38,title:"执行下方程序，会输出什么结果？<pre>b = ['电脑','Ipad','手机','照相机']\nprint(b[3])</pre>",options:{A:"电脑",B:"Ipad",C:"手机",D:"照相机"},answer:"D",analysis:"获取列表元素语法：列表[索引]。列表正序索引从0开始，索引为3的元素是照相机，所以打印b[3]会输出照相机，选择D选项。"},
  {id:39,title:"有2个苹果，又买了3个，然后吃掉了1个，现在还剩多少个？可用哪个表达式模拟？",options:{A:"2 - 3 + 1",B:"2 x 3 - 1",C:"2 + 3 - 1",D:"2 ÷ 3 + 1"},answer:"C",analysis:"又买了3个苹果数量增加用加法，即 2 + 3；吃掉1个数量减少用减法，即 2 + 3 - 1。故选择C选项。"},
  {id:40,title:"输入分数输出奖项，如果输入120，输出是？<pre>L = ['一等奖','二等奖','三等奖']\ns = int(input())\nif s > 99:\n  print(L[0])\nelif s > 89:\n  print(L[1])\nelse:\n  print(L[2])</pre>",options:{A:"一等奖",B:"二等奖",C:"三等奖",D:"没有获奖"},answer:"A",analysis:"输入120时s为120，if s > 99成立，执行print(L[0])，L[0]对应“一等奖”。注意列表索引从0开始。答案选A。"},
  {id:41,title:"执行下方程序，会打印出几种颜色?<pre>color = ['红','橙','黄','绿','蓝','青','紫']\nfor i in color:\n  print(i)</pre>",options:{A:"2",B:"6",C:"7",D:"10"},answer:"C",analysis:"程序遍历列表color并打印每个元素。列表color中共有7种颜色，所以会打印出7种颜色，选择C选项。"},
  {id:42,title:"执行下方程序，会输出几个“年龄达标”？<pre>emps = [21,18,22,16]\nfor emp in emps:\n  if emp >= 20:\n    print('年龄达标')</pre>",options:{A:"1",B:"2",C:"3",D:"4"},answer:"B",analysis:"程序遍历列表emps并判断是否大于等于20。四个元素中只有21和22大于等于20，所以会输出两次年龄达标，选择B选项。"},
  {id:43,title:"执行下方程序，输出结果是？<pre>L = []\nfor i in ['a','b','c']:\n  L.append(i)\nprint(L)</pre>",options:{A:"[]",B:"[0, 1, 2]",C:"['a', 'b', 'c']",D:"['a', 'b', 'c', 'd']"},answer:"C",analysis:"程序创建空列表，通过for循环把'a'、'b'、'c'依次追加到L末尾，最后输出['a','b','c']，选择C选项。"},
  {id:44,title:"先输入2，再输入3，会输出什么结果？<pre>x = int(input())\ny = int(input())\nif x < y:\n  print('x小于y')\nelif x > y:\n  print('x大于y')\nelse:\n  print('x等于y')</pre>",options:{A:"x小于y",B:"x大于y",C:"x等于y",D:"x!=y"},answer:"A",analysis:"变量x为2，y为3，x<y结果为True，if条件满足，直接输出x小于y。选择A选项。"},
  {id:45,title:"关于下方程序，描述正确的是？<pre>gift = ['书包','饭盒','钢笔']\nprint(random.choice(gift))</pre>",options:{A:"变量gift属于字典类型",B:"程序中存在循环结构",C:"该程序缺少模块导入，需添加 import random 语句才可以正常执行",D:"该程序可以正常运行，且输出结果为'书包'"},answer:"C",analysis:"gift最外层是中括号属列表；程序无循环结构；random.choice()属于random模块，缺少import random导入语句，故C正确。综上答案是C。"},
  {id:46,title:"想要遍历字符串\"AICE\"的每一个字符，横线处可以填写?<pre>___ i in \"AICE\":\n  print(i)</pre>",options:{A:"while",B:"elif",C:"for",D:"else"},answer:"C",analysis:"想要遍历字符串，横线处应该填写for，即使用for循环遍历\"AICE\"中的每一个字符并保存到变量i中。选择C选项。"},
  {id:47,title:"横线处填写什么，可以输出 ['大', '家', '好'] ？<pre>L = ['大','家','好','么']\nL.______('么')\nprint(L)</pre>",options:{A:"append",B:"remove",C:"pop",D:"extend"},answer:"B",analysis:"L.remove('么')可以删除列表L中的元素'么'，执行后输出['大','家','好']，符合题目要求。故选择B选项。"},
  {id:48,title:"补全下方代码，实现输入\"end\"时停止程序。<pre>while True:\n  N = input()\n  if N=='end':\n    _____</pre>",options:{A:"continue",B:"break",C:"N",D:"print('end')"},answer:"B",analysis:"这个程序是一个无限循环，想要停止程序即结束循环，使用break语句，选择B选项。"},
  {id:49,title:"执行下方程序，会输出什么？<pre>Lan = '汉语'\nif Lan == '英语':\n  print('hello')\nelif Lan == '日语':\n  print('こんにちは')\nelif Lan == '汉语':\n  print('您好')</pre>",options:{A:"汉语",B:"hello",C:"こんにちは",D:"您好"},answer:"D",analysis:"变量Lan为'汉语'，前两个条件不成立，elif Lan == '汉语'成立，执行print('您好')，输出'您好'，选择D选项。"},
  {id:50,title:"执行下方流程图，输入“5”，会输出什么？<br>开始→输入a→判断a<5，是则输出a，否则执行a=a+2后输出a→结束",options:{A:"5",B:"7",C:"9",D:"a"},answer:"B",analysis:"输入5时a为5，判断5<5不满足走“否”路线，执行a=a+2即a=7，最后输出a的值为7。故选择B选项。"},
  {id:51,title:"机器通过不断尝试下棋来积累经验、提高下棋的能力，这是人工智能的（ ）过程？",options:{A:"学习",B:"睡觉",C:"画画",D:"做饭"},answer:"A",analysis:"机器通过实践积累经验、提升能力的过程，属于人工智能的学习过程。故正确答案为A。"},
  {id:52,title:"以下哪个关键字表示“否则如果”？",options:{A:"if",B:"elif",C:"while",D:"break"},answer:"B",analysis:"if表示“如果”，elif表示“否则如果”，while是循环关键字，break表示结束循环。因此正确答案选B。"},
  {id:53,title:"执行下方程序，输出的结果是？<pre>w = '上升'\nscore = 15\nprint(w + str(score) + '米')</pre>",options:{A:"米15上升",B:"上升15",C:"上升",D:"上升15米"},answer:"D",analysis:"str(score)将整数15转换为字符串'15'，然后拼接'上升'、'15'和'米'，最终得到'上升15米'，选择D选项。"},
  {id:54,title:"查询系统代码如下，如果输入“停车”，程序会输出什么？<pre>while True:\n  a = input()\n  if a==\"查询\":\n    print(\"当前剩余车位数：10\")\n    break\n  else:\n    print(\"无效请求，请重新输入\")</pre>",options:{A:"当前剩余车位数：10",B:"无效请求，请重新输入",C:"无任何输出",D:"当前剩余车位数：10 无效请求，请重新输入"},answer:"B",analysis:"输入“停车”而不是“查询”，if条件不成立，执行else输出“无效请求，请重新输入”。故正确答案选B。"},
  {id:55,title:"老师用程序统计最高分。执行程序后，输出的结果是？<pre>score=[90,100,120,88,70]\nres = 0\nfor i in score:\n  if i>res:\n    res = i\nprint(res)</pre>",options:{A:"120",B:"70",C:"0",D:"468"},answer:"A",analysis:"代码在列表score中找最大值。res依次更新为90、100、120，之后88、70都小于120，res不变。循环结束res为120，也就是最大值，答案选A。"},
  {id:56,title:"执行程序，输出结果是“小红”。<pre>d = {'id':'001','name':'小红','age':10,'hobby':'编程'}\nprint(d['hobby'])</pre>",options:{A:"正确",B:"错误"},answer:"B",analysis:"字典通过键获取值。键'hobby'对应的值是'编程'，所以print(d['hobby'])的打印结果为编程，描述错误。"},
  {id:57,title:"下方列表M的长度是7。<pre>M = ['跳绳','游泳','踢足球']\nprint(len(M))</pre>",options:{A:"正确",B:"错误"},answer:"B",analysis:"len()可以获取列表的长度。列表M中有3个元素，所以列表M的长度为3，题目描述错误。"},
  {id:58,title:"执行下方程序，输出结果为False。<pre>a = True\nb = False\nprint(a or b)</pre>",options:{A:"正确",B:"错误"},answer:"B",analysis:"or表示或，只要有一个为真结果就为真。True or False结果为True，题目描述错误。"},
  {id:59,title:"下方程序在第5行存在1处语法错误，无法执行。<pre>a=20\nif a>30:\n  print(\"高温天气\")\nelif a>15:\nprint(\"温度适宜')\nelse:\n  print(\"寒冷天气\")</pre>",options:{A:"正确",B:"错误"},answer:"A",analysis:"第5行的print('温度适宜')缺少缩进格式，且单引号不匹配（左侧双引号右侧单引号），导致无法执行。故题目描述正确。"},

// ===== 自动为每道题打标签：知识点 + 题型 =====
(function classify(){
  // 判断题型
  function detectType(q){
    const keys = Object.keys(q.options);
    if (keys.length === 2 && q.options.A === '正确' && q.options.B === '错误') return '判断题';
    return '选择题';
  }
  // 知识点关键词（按优先级从上到下匹配，命中即归类）
  const rules = [
    ['人工智能', /人工智能|图灵|AI |AI工具|AI 工具|图像识别|语音识别|人脸|网络安全|自然语言|机器/],
    ['数学逻辑', /等式|苹果|排队|多少名|计算出|△|□/],
    ['字典', /字典|键值对|键名/],
    ['列表操作', /列表|\.append|\.remove|\.pop|\.index|len\(|\[/],
    ['循环结构', /for |while |range\(|循环|遍历|break|continue|sleep/],
    ['分支结构', /if |elif|else|分支|流程图|判断|密码|奖/],
    ['字符串与数据类型', /字符串|拼接|str\(|int\(|数据类型|逻辑运算|and |or |True|False/],
  ];
  questionBank.forEach(q=>{
    q.type = detectType(q);
    // 仅用题面 + 选项文本参与分类，避免 JSON 花括号干扰
    const text = q.title + ' ' + Object.values(q.options).join(' ');
    let topic = '综合';
    for (const [name, re] of rules){ if (re.test(text)){ topic = name; break; } }
    q.topic = topic;
  });
})();

// 供筛选用的去重列表
const ALL_TOPICS = [...new Set(questionBank.map(q=>q.topic))];
const ALL_TYPES  = [...new Set(questionBank.map(q=>q.type))];

// ===================== 视图切换 =====================
const views = {
  home: document.getElementById('homeView'),
  exam: document.getElementById('examView'),
  result: document.getElementById('resultView'),
  study: document.getElementById('studyView'),
};
function show(name){
  Object.values(views).forEach(v=>v.classList.add('hidden'));
  views[name].classList.remove('hidden');
}
function goHome(){ show('home'); }

document.getElementById('totalCount').textContent = questionBank.length;

// 知识点/题型直接使用原始名称，不做改写
function topicLabel(t){ return t; }
function typeLabel(t){ return t; }

// ===================== 音效（Web Audio 合成，无需外部文件）=====================
let _audioCtx = null;
function audioCtx(){
  if (!_audioCtx){ try{ _audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  return _audioCtx;
}
function playTone(freqs, dur){
  const ctx = audioCtx(); if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const t0 = ctx.currentTime;
  freqs.forEach((f,i)=>{
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = f;
    const start = t0 + i*0.08;
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(0.25, start+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, start+dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(start); osc.stop(start+dur);
  });
}
function playCorrect(){ playTone([880, 1320], 0.35); }   // 清脆上行“叮”
function playWrong(){ playTone([300, 200], 0.3); }       // 低沉下行“噔”

// 判断题？（A=正确 B=错误 两个选项）
function isTrueFalse(q){
  const keys = Object.keys(q.options);
  return keys.length===2 && q.options.A==='正确' && q.options.B==='错误';
}

// 生成选项 HTML：判断题→大按钮；选择题→A/B/C/D 列表
// mode: 'exam' | 'study'；graded 传入后（刷题提交/学习看答案）会标出对错
function buildOptions(q, picked, pickFn, graded){
  if (isTrueFalse(q)){
    const cell = (key, cls, icon, label)=>{
      let c = 'tf-btn ' + cls + (picked===key?' selected':'');
      if (graded){ if(key===q.answer) c='tf-btn '+cls+' correct'; else if(picked===key) c='tf-btn '+cls+' wrong'; }
      const onclick = graded ? '' : `onclick="${pickFn}('${key}')"`;
      return `<div class="${c}" ${onclick}><div class="tf-icon">${icon}</div><div class="tf-label">${label}</div></div>`;
    };
    return `<div class="tf-options">${cell('A','yes','✅','对')}${cell('B','no','❌','错')}</div>`;
  }
  let opts = '';
  for (const [k,v] of Object.entries(q.options)){
    let cls = 'opt' + (picked===k?' selected':'');
    if (graded){ if(k===q.answer) cls='opt correct'; else if(picked===k) cls='opt wrong'; }
    const onclick = graded ? '' : `onclick="${pickFn}('${k}')"`;
    opts += `<div class="${cls}" ${onclick}><span class="key">${k}</span><span class="txt">${v}</span></div>`;
  }
  return `<div class="options">${opts}</div>`;
}

function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// ===================== 刷题模式 =====================
let examQs = [], examIdx = 0, examAns = {}, examSubmitted = false;

function enterExam(){
  examQs = shuffle(questionBank).slice(0, 10);
  examIdx = 0; examAns = {}; examSubmitted = false;
  show('exam');
  renderExam();
}

function renderExam(){
  const q = examQs[examIdx];
  const total = examQs.length;
  document.getElementById('examProgress').textContent = `第 ${examIdx+1} / ${total} 题`;
  document.getElementById('examBar').style.width = ((examIdx+1)/total*100)+'%';

  const optsHtml = buildOptions(q, examAns[q.id], 'pickExam', examSubmitted);

  let analysis = '';
  if (examSubmitted){
    analysis = `<div class="analysis"><div class="ans">正确答案：<em>${fullAnswer(q)}</em></div><b>解析：</b>${q.analysis}</div>`;
  }

  document.getElementById('examBody').innerHTML = `
    <div class="q-meta"><span class="tag">${topicLabel(q.topic)}</span><span class="tag type">${typeLabel(q.type)}</span></div>
    <div class="q-title">${q.title}</div>
    ${optsHtml}
    ${analysis}
  `;

  document.getElementById('prevBtn').disabled = examIdx === 0;
  const isLast = examIdx === total-1;
  document.getElementById('nextBtn').classList.toggle('hidden', isLast);
  document.getElementById('submitBtn').classList.toggle('hidden', !isLast || examSubmitted);
}

function pickExam(k){
  const q = examQs[examIdx];
  examAns[q.id] = k;
  renderExam();
}
function examPrev(){ if (examIdx>0){ examIdx--; renderExam(); } }
function examNext(){ if (examIdx<examQs.length-1){ examIdx++; renderExam(); } }

// 完整答案文字，如 "B、图灵"
function fullAnswer(q){
  return q.answer + '、' + q.options[q.answer];
}

function examSubmit(){
  let correct = 0;
  examQs.forEach(q=>{ if (examAns[q.id]===q.answer) correct++; });
  const total = examQs.length;

  document.getElementById('scoreNum').textContent = correct;
  document.getElementById('scoreText').textContent = correct;
  document.getElementById('scoreRing').style.setProperty('--p', (correct/total*360)+'deg');

  // 星星评级 + 鼓励语
  const rate = correct/total;
  let stars, praise;
  if (rate === 1)      { stars='⭐⭐⭐'; praise='太厉害啦，全部答对！你是小小编程高手！'; }
  else if (rate >= 0.8){ stars='⭐⭐⭐'; praise='真棒！你已经很厉害了，继续加油！'; }
  else if (rate >= 0.6){ stars='⭐⭐';   praise='不错哦，再多练几次就更棒了！'; }
  else if (rate >= 0.4){ stars='⭐';     praise='有进步空间，看看错题，你一定行！'; }
  else                 { stars='💪';     praise='别灰心，先看看下面的讲解，再来一次吧！'; }
  document.getElementById('resultStars').textContent = stars;
  document.getElementById('resultPraise').textContent = praise;

  // 交卷音效：答对六成以上给“叮”，否则给“噔”
  if (rate >= 0.6) playCorrect(); else playWrong();

  const wrong = examQs.filter(q=>examAns[q.id]!==q.answer);
  let html = '';
  if (wrong.length===0){
    html = '<h3 style="color:#67c23a;">🎉 全部答对，太棒了！</h3>';
  } else {
    html = `<h3>要复习的题目（${wrong.length}题）</h3>`;
    wrong.forEach(q=>{
      const mine = examAns[q.id] ? examAns[q.id]+'、'+q.options[examAns[q.id]] : '没有作答';
      html += `<div class="wrong-item">
        <div class="wt">${q.title}</div>
        <div class="line mine">❌ 你选的：${mine}</div>
        <div class="line right">✅ 正确答案：${fullAnswer(q)}</div>
        <div class="exp">💡 ${q.analysis}</div>
      </div>`;
    });
  }
  document.getElementById('wrongList').innerHTML = html;
  show('result');
}

// ===================== 学习模式 =====================
let studyTopic = '全部', studyType = '全部', studyCurrent = null;

function enterStudy(){
  studyTopic = '全部'; studyType = '全部'; studyCurrent = null;
  renderChips();
  document.getElementById('studyBody').innerHTML = '<p style="text-align:center;color:#9ca3af;padding:30px 0;">选择筛选条件后，点击「随机出题」</p>';
  updateStudyCount();
  show('study');
}

function renderChips(){
  const topicBox = document.getElementById('topicChips');
  const typeBox = document.getElementById('typeChips');
  const topics = ['全部', ...ALL_TOPICS];
  const types  = ['全部', ...ALL_TYPES];
  topicBox.innerHTML = topics.map(t=>`<div class="chip ${t===studyTopic?'active':''}" onclick="setTopic('${t}')">${topicLabel(t)}</div>`).join('');
  typeBox.innerHTML  = types.map(t=>`<div class="chip ${t===studyType?'active':''}" onclick="setType('${t}')">${typeLabel(t)}</div>`).join('');
}
function setTopic(t){ studyTopic=t; renderChips(); updateStudyCount(); }
function setType(t){ studyType=t; renderChips(); updateStudyCount(); }

function filteredStudy(){
  return questionBank.filter(q=>
    (studyTopic==='全部'||q.topic===studyTopic) &&
    (studyType==='全部'||q.type===studyType)
  );
}
function updateStudyCount(){
  const n = filteredStudy().length;
  document.getElementById('studyCount').textContent = `当前筛选下共 ${n} 道题`;
}

let studyPick = null;   // 学习模式下孩子选的答案

function drawStudyQuestion(){
  const pool = filteredStudy();
  if (pool.length===0){
    document.getElementById('studyBody').innerHTML = '<p style="text-align:center;color:#f56c6c;padding:30px 0;">这里还没有题目哦，换个选项试试吧～</p>';
    return;
  }
  const q = pool[Math.floor(Math.random()*pool.length)];
  studyCurrent = q;
  studyPick = null;
  renderStudyQuestion();
}

function renderStudyQuestion(){
  const q = studyCurrent;
  const optsHtml = buildOptions(q, studyPick, 'pickStudy', false);
  document.getElementById('studyBody').innerHTML = `
    <div class="q-meta"><span class="tag">${topicLabel(q.topic)}</span><span class="tag type">${typeLabel(q.type)}</span></div>
    <div class="q-title">${q.title}</div>
    ${optsHtml}
    <div class="toolbar" style="margin-top:20px;">
      <button class="btn warn" onclick="openAnsModal()">显示答案</button>
      <div class="spacer"></div>
      <button class="btn ghost" onclick="drawStudyQuestion()">换一题</button>
    </div>
  `;
}

function pickStudy(k){
  studyPick = k;
  renderStudyQuestion();
}

// ===================== 显示答案弹窗 =====================
function openAnsModal(){
  if (!studyCurrent) return;
  const q = studyCurrent;
  // 弹窗顶部：如果孩子选了，先告诉他对不对
  const head = document.getElementById('modalResult');
  if (studyPick === null){
    head.className = 'modal-result';
    head.innerHTML = '你还没有选答案，先看看正确答案吧～';
  } else if (studyPick === q.answer){
    head.className = 'modal-result ok';
    head.innerHTML = '🎉 答对啦，你真棒！';
    playCorrect();
  } else {
    head.className = 'modal-result no';
    head.innerHTML = `再想想～你选的是 ${studyPick}，正确答案是下面这个哦`;
    playWrong();
  }
  document.getElementById('modalAns').textContent = fullAnswer(q);
  document.getElementById('modalExp').innerHTML = '<b>为什么呢：</b>' + q.analysis;
  document.getElementById('ansModal').classList.add('show');
}
function closeAnsModal(){
  document.getElementById('ansModal').classList.remove('show');
}
